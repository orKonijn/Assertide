apiVersion: v1
kind: Namespace
metadata:
  name: assertide-workers
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-worker-network
  namespace: assertide-workers
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: worker-budget
  namespace: assertide-workers
spec:
  hard:
    pods: '20'
    requests.cpu: '6'
    requests.memory: 12Gi
    limits.cpu: '100'
    limits.memory: 45Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: assertide-execution
  namespace: assertide-workers
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create, get]
