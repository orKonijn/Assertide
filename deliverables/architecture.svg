<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">Assertide execution and reporting architecture</title><desc id="desc">Angular sends run requests to NestJS. PostgreSQL stores run state and an outbox dispatches to BullMQ. Isolated Playwright jobs test approved targets and store artifacts. Separate Allure jobs build reports. An authorized gateway serves report and evidence assets.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#58657b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#182237}.h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#58657b}.box{fill:#fff;stroke:#d8dfea;stroke-width:1.5}.edge{fill:none;stroke:#58657b;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1120" height="660" rx="18" fill="#f5f6fa"/><text x="32" y="42" font-size="24" font-weight="700">Assertide architecture</text><text x="32" y="66" class="s">Separate orchestration, execution and active report content</text>
<g><rect class="box" x="32" y="110" width="220" height="90" rx="12"/><text x="52" y="144" class="h">Angular client</text><text x="52" y="170" class="s">REST commands · SSE progress</text></g>
<g><rect class="box" x="332" y="110" width="220" height="90" rx="12"/><text x="352" y="144" class="h">NestJS control API</text><text x="352" y="170" class="s">Auth · policy · event ingestion</text></g>
<g><rect class="box" x="632" y="110" width="220" height="90" rx="12"/><text x="652" y="144" class="h">PostgreSQL</text><text x="652" y="170" class="s">Authoritative state + outbox</text></g>
<path class="edge" d="M252 155H332"/><path class="edge" d="M552 155H632"/>
<g><rect class="box" x="632" y="280" width="220" height="90" rx="12"/><text x="652" y="314" class="h">BullMQ + orchestrator</text><text x="652" y="340" class="s">Fair queue · fenced leases</text></g>
<path class="edge" d="M742 200V280"/><text class="s" x="757" y="243">Outbox dispatch</text>
<g><rect x="332" y="280" width="220" height="90" rx="12" fill="#eeebff" stroke="#5145cd"/><text x="352" y="314" class="h">Isolated Playwright job</text><text x="352" y="340" class="s">Approved bundle · limited egress</text></g>
<path class="edge" d="M632 325H552"/><path class="edge" d="M442 280V200"/><text class="s" x="455" y="246">Attempt events</text>
<g><rect class="box" x="32" y="280" width="220" height="90" rx="12"/><text x="52" y="314" class="h">Approved sandboxes</text><text x="52" y="340" class="s">UI fixtures · controlled Lab API</text></g><path class="edge" d="M332 325H252"/>
<g><rect class="box" x="332" y="460" width="220" height="90" rx="12"/><text x="352" y="494" class="h">Private object storage</text><text x="352" y="520" class="s">Raw results · traces · reports</text></g><path class="edge" d="M442 370V460"/><text class="s" x="455" y="418">Scoped uploads</text>
<g><rect x="632" y="460" width="220" height="90" rx="12" fill="#eeebff" stroke="#5145cd"/><text x="652" y="494" class="h">Allure report job</text><text x="652" y="520" class="s">Serialized history · atomic publish</text></g><path class="edge" d="M742 370V460"/><path class="edge" d="M632 505H552"/>
<g><rect class="box" x="32" y="460" width="220" height="90" rx="12"/><text x="52" y="494" class="h">Artifact gateway</text><text x="52" y="520" class="s">Authorized isolated report origin</text></g><path class="edge" d="M332 505H252"/><path class="edge" d="M66 460V410H12V220H66V200"/>
<text x="892" y="146" class="h">Trust boundaries</text><text x="892" y="179" class="s">No secrets in URLs</text><text x="892" y="204" class="s">No arbitrary shell input</text><text x="892" y="229" class="s">No shared app cookies</text><text x="892" y="254" class="s">Tenant-scoped access</text><text x="892" y="279" class="s">Immutable run snapshots</text>
<text x="32" y="607" class="s">Test outcome and report readiness are independent. A failed report build never rewrites test results.</text><text x="32" y="631" class="s">Architecture specification · proposed system, not deployed infrastructure</text></svg>
