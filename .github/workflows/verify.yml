name: Verify
on:
  pull_request:
  push:
    branches: [feature/assertide-platform]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: node --test packages/domain/execution.test.ts
      - run: node apps/web/node_modules/typescript/bin/tsc -p packages/domain/tsconfig.json
      - run: npm test -- --watch=false
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
