name: Verify
on:
  pull_request:
  push:
    branches: [feature/assertide-platform]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: node --test packages/domain/execution.test.ts
      - run: node apps/web/node_modules/typescript/bin/tsc -p packages/domain/tsconfig.json
      - run: npm test -- --watch=false
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/api
      - run: npm run typecheck
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api
      - run: npm ci
        working-directory: packages/automation
      - run: npx playwright install --with-deps chromium
        working-directory: packages/automation
      - run: node scripts/setup-sandbox.mjs
      - run: npx playwright test --config platform.config.ts
        working-directory: packages/automation
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screenshots
          path: packages/automation/test-results/**/*.png
