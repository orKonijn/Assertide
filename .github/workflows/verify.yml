name: Verify
on:
  pull_request:
  push:
    branches: [feature/assertide-platform]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: assertide_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: assertide_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assertide_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: node --test packages/domain/execution.test.ts
      - run: node apps/web/node_modules/typescript/bin/tsc -p packages/domain/tsconfig.json
      - run: npm test -- --watch=false
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/api
      - run: npm run typecheck
        working-directory: apps/api
      - run: npm ci
        working-directory: packages/automation
      - run: npm test
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://assertide_test:local_ci_only@127.0.0.1:5432/assertide_test
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - run: npx playwright install --with-deps chromium
        working-directory: packages/automation
      - run: node scripts/setup-sandbox.mjs
      - run: node packages/automation/checks/video.mjs
      - run: npx playwright test --config platform.config.ts
        working-directory: packages/automation
        env:
          DATABASE_URL: postgres://assertide_test:local_ci_only@127.0.0.1:5432/assertide_test
          REDIS_URL: redis://127.0.0.1:6379
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screenshots
          path: packages/automation/test-results/**/*.png
